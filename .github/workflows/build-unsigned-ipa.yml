name: Build Unsigned IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点按钮触发构建
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
      - name: 进入ios目录，安装CocoaPods
        run: |
          cd ios
          pod install --repo-update
      - name: Archive 不签名打包
        run: |
          cd ios
          xcodebuild archive \
            -workspace ShengQiao.xcworkspace \
            -scheme ShengQiao \
            -configuration Release \
            -archivePath ./build/ShengQiao.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: 从xcarchive提取app，打包成未签名IPA
        run: |
          cd ios/build/ShengQiao.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r ShengQiao.app Payload/
          zip -qr ShengQiao_unsigned.ipa Payload
      - name: 上传未签名IPA产物
        uses: actions/upload-artifact@v4
        with:
          name: ShengQiao_未签名IPA
          path: ios/build/ShengQiao.xcarchive/Products/Applications/ShengQiao_unsigned.ipa
